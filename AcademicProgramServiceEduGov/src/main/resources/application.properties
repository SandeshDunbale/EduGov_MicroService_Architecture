# Identity - Must match the filename in your GitHub
spring.application.name=ACADEMICPROGRAMSERVICEEDUGOV

# SPECIFIC DATABASE CONNECTION FOR ACADEMIC SERVICE
spring.datasource.url=jdbc:mysql://localhost:3306/edugov_academic_db?createDatabaseIfNotExist=true
# spring.datasource.username=root
# spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Networking & Service Discovery
server.port=8085
eureka.client.service-url.defaultZone=http://localhost:8001/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=localhost

# Config Server Connection
spring.config.import=optional:configserver:http://localhost:8000

# Server configuration
server.tomcat.basedir=.tomcat


# 1. Enable Feign Circuit Breaker (The correct property)
spring.cloud.openfeign.circuitbreaker.enabled=true

# 2. Resilience4j Configuration for Identity Service (UserClient)
# Used in CourseServiceImpl, EnrollmentServiceImpl, ProgramServiceImpl
resilience4j.circuitbreaker.instances.identityService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.identityService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.identityService.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.identityService.permittedNumberOfCallsInHalfOpenState=3

# 3. Resilience4j Configuration for Registration Service (Faculty/StudentClient)
# Used in EnrollmentServiceImpl and CourseServiceImpl
resilience4j.circuitbreaker.instances.registrationService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.registrationService.failureRateThreshold=60
resilience4j.circuitbreaker.instances.registrationService.waitDurationInOpenState=15s

# 4. Resilience4j Configuration for Notification Service
# Used across all services for sending alerts
resilience4j.circuitbreaker.instances.notificationService.slidingWindowSize=5
resilience4j.circuitbreaker.instances.notificationService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.notificationService.waitDurationInOpenState=20s

# 5. Timeouts (Crucial for Feign)
# If the external service takes longer than 2s, trigger the fallback
resilience4j.timelimiter.instances.identityService.timeoutDuration=2s
resilience4j.timelimiter.instances.registrationService.timeoutDuration=3s

# 6. Actuator visibility (Optional: to see if circuit is OPEN or CLOSED)
management.health.circuitbreakers.enabled=true
management.endpoints.web.exposure.include=health,info