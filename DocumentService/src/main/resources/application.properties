# ==========================================================
# 1. SERVER & IDENTITY
# ==========================================================
spring.application.name=DOCUMENT-SERVICE
server.port=8082

# ==========================================================
# 2. DATABASE CONFIGURATION
# ==========================================================
spring.datasource.url=jdbc:mysql://localhost:3306/edugov_document_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ==========================================================
# 3. MICROSERVICES & DISCOVERY (EUREKA)
# ==========================================================
# Points to your Eureka Server (Standard port 8761)
eureka.client.service-url.defaultZone=http://localhost:8001/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# ==========================================================
# 4. FILE STORAGE & UPLOAD SETTINGS
# ==========================================================
# This matches your @Value("${file.upload-dir}") in Java
file.upload-dir=./edugov-storage

# Maximum file size allowed for uploads (e.g., Certificates, PDFs)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.cloud.gateway.routes[0].id=DOCUMENT-SERVICE
spring.cloud.gateway.routes[0].uri=lb://DOCUMENT-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/documents/**
spring.cloud.config.enabled=false

