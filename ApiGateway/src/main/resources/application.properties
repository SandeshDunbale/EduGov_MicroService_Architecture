server.port=8002
spring.application.name=API-GATEWAY

# Force Gateway to load manual routes
spring.cloud.gateway.enabled=true
spring.cloud.gateway.discovery.locator.enabled=false
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# Eureka Configuration
eureka.client.service-url.defaultZone=http://localhost:8001/eureka/
eureka.instance.prefer-ip-address=true

# Gateway Route Configuration
# Force the binder to see the routes
spring.cloud.gateway.routes[0].id=academic-service-route
spring.cloud.gateway.routes[0].uri=lb://ACADEMIC-SERVICE
spring.cloud.gateway.routes[0].predicates[0].name=Path
spring.cloud.gateway.routes[0].predicates[0].args.patterns=/programs/**,/courses/**,/enrollments/**

# Enabling Actuator for Debugging
management.endpoints.web.exposure.include=health,gateway,info
management.endpoint.gateway.enabled=true