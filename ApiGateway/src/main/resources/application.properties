spring.application.name=ApiGateway
server.port=8002

spring.config.import=optional:configserver:http://localhost:8000

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true

# Gateway Discovery
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# Route to Resource & Infrastructure Service
spring.cloud.gateway.routes[0].id=resource-infra-service
spring.cloud.gateway.routes[0].uri=lb://resourceandinfrastructureservice
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/**

management.endpoints.web.exposure.include=prometheus,health,info
management.endpoint.health.show-details=always