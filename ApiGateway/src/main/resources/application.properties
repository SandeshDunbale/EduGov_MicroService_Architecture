# --- Active Configuration ---

# Service Name and Port
server.port=8002
spring.application.name=API-GATEWAY

# Gateway must run on a Reactive (Netty) stack
spring.main.web-application-type=reactive

# Eureka Registration & Discovery
# Gateway needs to register and fetch the registry to find other services
eureka.client.service-url.defaultZone=http://localhost:8001/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=localhost

# Route Configuration
# Disable the auto-locator to ensure the gateway strictly follows your GatewayConfig.java
spring.cloud.gateway.discovery.locator.enabled=false

# Logging
logging.level.org.springframework.cloud.gateway=DEBUG


