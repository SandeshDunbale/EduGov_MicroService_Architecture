server.port=8002
spring.application.name=ApiGateway

# Gateway must run on a Reactive (Netty) stack
spring.main.web-application-type=reactive

# ==========================================
# Eureka & Discovery
# ==========================================
eureka.client.service-url.defaultZone=http://localhost:8001/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
spring.cloud.gateway.discovery.locator.enabled=false

logging.level.org.springframework.cloud.gateway=DEBUG

# ==========================================
# API Gateway Routes (WebFlux)
# ==========================================

# 1. Research & Grants
spring.cloud.gateway.server.webflux.routes[0].id=research-project-route
spring.cloud.gateway.server.webflux.routes[0].uri=lb://RESEARCHANDGRANTSERVICEEDUGOV
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/research-projects/**

spring.cloud.gateway.server.webflux.routes[1].id=grant-applications-route
spring.cloud.gateway.server.webflux.routes[1].uri=lb://RESEARCHANDGRANTSERVICEEDUGOV
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/grant-applications/**

# 2. Academic Programs
spring.cloud.gateway.server.webflux.routes[2].id=programs-route
spring.cloud.gateway.server.webflux.routes[2].uri=lb://ACADEMICPROGRAMSERVICEEDUGOV
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/programs/**

# 3. Registration
spring.cloud.gateway.server.webflux.routes[3].id=students-route
spring.cloud.gateway.server.webflux.routes[3].uri=lb://REGISTRATIONSERVICEEDUGOV
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/students/**,/faculty/**,/api/students/**

# 4. Identity (Auth)
spring.cloud.gateway.server.webflux.routes[4].id=users-route
spring.cloud.gateway.server.webflux.routes[4].uri=lb://IDENTITYSERVICEEDUGOV
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/users/**

# 5. Compliance & Audits
spring.cloud.gateway.server.webflux.routes[5].id=compliance-route
spring.cloud.gateway.server.webflux.routes[5].uri=lb://COMPLIANCEANDGOVERNANCESERVICEEDUGOV
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/api/compliance/**

spring.cloud.gateway.server.webflux.routes[6].id=audits-route
spring.cloud.gateway.server.webflux.routes[6].uri=lb://COMPLIANCEANDGOVERNANCESERVICEEDUGOV
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/api/audits/**

# 6. Reporting & Analytics
spring.cloud.gateway.server.webflux.routes[7].id=reporting-analytics-route
spring.cloud.gateway.server.webflux.routes[7].uri=lb://REPORTINGANDANALYTICSSERVICEEDUGOV
spring.cloud.gateway.server.webflux.routes[7].predicates[0]=Path=/api/reports/**

# 7. Document Service
spring.cloud.gateway.server.webflux.routes[8].id=document-service
spring.cloud.gateway.server.webflux.routes[8].uri=lb://DOCUMENT-SERVICE
spring.cloud.gateway.server.webflux.routes[8].predicates[0]=Path=/api/documents/**

# ==========================================
# API Gateway Routes (Standard)
# ==========================================

# 8. Notifications
spring.cloud.gateway.routes[0].id=notification-route
spring.cloud.gateway.routes[0].uri=lb://NOTIFICATIONSSERVICEEDUGOV
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/notifications/**