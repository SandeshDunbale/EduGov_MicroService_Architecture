spring.application.name=ComplianceAndGovernanceServiceEduGov
server.port=8086

# Database Configuration

spring.datasource.url=jdbc:mysql://localhost:3306/ComplianceAndGovernanceServiceEduGov?createDatabaseIfNotExist=true


spring.config.import=optional:configserver:http://localhost:8000
 
eureka.instance.prefer-ip-address=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
 
#spring.application.name=ResearchAndGrantServiceEduGov
eureka.client.service-url.defaultZone=http://localhost:8001/eureka/


# --- Resilience4j Circuit Breaker Configurations ---

# Audit API Instance
resilience4j.circuitbreaker.instances.auditApi.slidingWindowSize=10
resilience4j.circuitbreaker.instances.auditApi.failureRateThreshold=50
resilience4j.circuitbreaker.instances.auditApi.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.auditApi.registerHealthIndicator=true

# Compliance API Instance
resilience4j.circuitbreaker.instances.complianceApi.slidingWindowSize=5
resilience4j.circuitbreaker.instances.complianceApi.failureRateThreshold=40
resilience4j.circuitbreaker.instances.complianceApi.waitDurationInOpenState=20s
resilience4j.circuitbreaker.instances.complianceApi.registerHealthIndicator=true

# Enable Endpoint Monitoring (Highly Recommended for Microservices)
management.endpoints.web.exposure.include=health,info,circuitbreakers
management.endpoint.health.show-details=always

# Enable Feign to respect Resilience4j circuit breakers
feign.circuitbreaker.enabled=true