
spring.application.name=EurekaService
server.port=8001


# Disable self-registration as a client

# Prevent the server from registering with itself

eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
# Explicitly set the service URL to match your server port
# This prevents the server from looking for peers on 8761
eureka.client.service-url.defaultZone=http://localhost:8001/eureka/

eureka.instance.prefer-ip-address=true

# Simple UI config
eureka.instance.hostname=localhost
