spring.application.name=IDENTITYSERVICEEDUGOV
eureka.instance.instance-id=${spring.application.name}:${server.port}
spring.datasource.url=jdbc:mysql://localhost:3306/edugov_identity_db?createDatabaseIfNotExist=true
server.port=8006
eureka.client.service-url.defaultZone=http://localhost:8001/eureka/
# Tell the microservice where the Config Server is running
spring.config.import=optional:configserver:http://localhost:8000
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=localhost
#eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=127.0.0.1
server.tomcat.basedir=.tomcat
