spring.application.name=ReportingAndAnalyticsServiceEduGov
 
spring.datasource.url=jdbc:mysql://localhost:3306/report_db?createDatabaseIfNotExist=true
#spring.datasource.username=root
#spring.datasource.password=Root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true



#spring.application.name=ReortingAndAnalyticsServiceEduGov


server.port=2026
spring.config.import=optional:configserver:http://localhost:8000

eureka.instance.prefer-ip-address=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

eureka.client.service-url.defaultZone=http://localhost:8001/eureka/
# Resilience4j Circuit Breaker Configuration
resilience4j.circuitbreaker.instances.reportService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.reportService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.reportService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.reportService.waitDurationInOpenState=15s
resilience4j.circuitbreaker.instances.reportService.slowCallDurationThreshold=3000ms
resilience4j.circuitbreaker.instances.reportService.permittedNumberOfCallsInHalfOpenState=3

# Enable Health Endpoint (Optional but helpful for debugging)
management.health.circuitbreakers.enabled=true
management.endpoints.web.exposure.include=health