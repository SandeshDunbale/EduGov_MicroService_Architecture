spring.application.name=RegistrationServiceEduGov
server.port=8081

# 1. Config Server Connection
spring.cloud.config.enabled=true
spring.config.import=optional:configserver:http://localhost:8000
# Allows local properties to override Config Server values
spring.cloud.config.allow-override=true
spring.cloud.config.override-none=true

# 2. Eureka Registration
eureka.client.service-url.defaultZone=http://localhost:8001/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# 3. Database Settings
spring.datasource.url=jdbc:mysql://localhost:3306/edugov_db?createDatabaseIfNotExist=true
spring.datasource.username=root
# Ensure DB_PASSWORD is set in your Environment Variables
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 4. JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true