# =====================================================
# APPLICATION
# =====================================================
spring.application.name=ResourceAndInfrastructureService
server.port=2004

# =====================================================
# CONFIG SERVER (OPTIONAL)
# =====================================================
spring.config.import=optional:configserver:http://localhost:8000

# =====================================================
# EUREKA
# =====================================================
eureka.client.service-url.defaultZone=http://localhost:8001/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=localhost

# =====================================================
# DATABASE
# =====================================================
spring.datasource.url=jdbc:mysql://localhost:3306/edugov_resource_infra?createDatabaseIfNotExist=true
#spring.datasource.username=root
#spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# =====================================================
# FEIGN
# =====================================================
logging.level.org.springframework.cloud.openfeign=DEBUG

# =====================================================
# ACTUATOR (OPTIONAL BUT RECOMMENDED)
# =====================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# =====================================================
# RESILIENCE4J - CIRCUIT BREAKER
# =====================================================

# -------- USER SERVICE (HARD DEPENDENCY) --------
resilience4j.circuitbreaker.instances.userService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.userService.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.userService.sliding-window-size=10
resilience4j.circuitbreaker.instances.userService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.userService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.userService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.userService.register-health-indicator=true

# -------- PROGRAM SERVICE (HARD DEPENDENCY) --------
resilience4j.circuitbreaker.instances.programService.failure-rate-threshold=40
resilience4j.circuitbreaker.instances.programService.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.programService.sliding-window-size=10
resilience4j.circuitbreaker.instances.programService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.programService.wait-duration-in-open-state=15s
resilience4j.circuitbreaker.instances.programService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.programService.register-health-indicator=true

# -------- NOTIFICATION SERVICE (SOFT DEPENDENCY) --------
resilience4j.circuitbreaker.instances.notificationService.failure-rate-threshold=80
resilience4j.circuitbreaker.instances.notificationService.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.notificationService.sliding-window-size=20
resilience4j.circuitbreaker.instances.notificationService.minimum-number-of-calls=10
resilience4j.circuitbreaker.instances.notificationService.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.notificationService.permitted-number-of-calls-in-half-open-state=5
resilience4j.circuitbreaker.instances.notificationService.register-health-indicator=true